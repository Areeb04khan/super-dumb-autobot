name: Super Dumb Heroes Automation

on:
  schedule:
    # Runs at 12:00 AM, 6:00 AM, 12:00 PM, and 6:00 PM (UTC)
    - cron: '0 0,6,12,18 * * *'  
  workflow_dispatch:      # Allows you to trigger the workflow manually

jobs:
  post-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # CRITICAL FIX: Grants the GITHUB_TOKEN permission to create Releases and upload video files
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra imagemagick
          fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests moviepy==1.0.3 numpy edge-tts huggingface_hub pillow

      - name: Run Super Dumb Heroes Bot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u poster.py
        
